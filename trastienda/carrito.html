  <header>

  <main>
    <section>
      <h2>Artículos en la cesta</h2>
      
      <article>
        <img src="img/foto1.jpg" alt="Portada de La paciente silenciosa">
        <div>
          <h3>La paciente silenciosa</h3>
          <p>Alex Michaelides · Tapa dura</p>
          <div>
            <button type="button" aria-label="Quitar un ejemplar de La paciente silenciosa">−</button>

            <button type="button" aria-label="Añadir un ejemplar de El psicoanalista">+</button>
          </div>

      <dl>
        <dt>Subtotal</dt>
        <dd>38,40 €</dd>

        <dd>Gratis</dd>
        
        <dt>Total</dt>
        <dd>38,40 €</dd>
